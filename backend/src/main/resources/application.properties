spring.config.import=optional:file:.env.properties
server.port=8080

# PostgreSQL Configuration
# Swap these with your Supabase Transaction URL and password when ready
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# ── HikariCP Connection Pool — Resilience Settings ──────────────────────────
# Validate connection before handing it to Spring (catches aborted transactions)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=SELECT 1
# If a connection is not valid, evict it immediately
spring.datasource.hikari.validation-timeout=3000
# Timeouts
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
# Pool size — keeps at least 2 healthy connections ready
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
# Auto-commit ON — prevents connections staying in transaction state
spring.datasource.hikari.auto-commit=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Hibernate — rollback on failure, never leave connection in broken state
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Security Configuration
server.error.include-message=always